<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Universe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="welcome">
      <img class="alice" src="assets/alice-wonderland-sketch.png" alt="Alice in Wonderland illustration">

      <div class="hero-copy">
        <p class="eyebrow">Step through the looking glass</p>
        <h1 id="welcome">Welcome to<br>My Universe.</h1>
        <a class="enter" href="#doors">Enter <b>↓</b></a>
      </div>
    </section>

    <section class="doors" id="doors">
      <header class="doors-copy">
        <p class="eyebrow">Choose a doorway</p>
        <h2>Four worlds,<br>waiting to open.</h2>
      </header>

      <nav class="knob-picker" aria-label="Explore my universe">
        <img src="assets/doorknobs-sketch.png" alt="Illustrated collection of door knobs">

        <a class="knob-link language" href="pages/language.html">
          <span>World of<br>Language</span>
        </a>

        <a class="knob-link visual" href="pages/visual.html">
          <span>World of<br>Visual</span>
        </a>

        <a class="knob-link wavelength" href="pages/sound.html">
          <span>World of<br>Wavelength</span>
        </a>

        <a class="knob-link meetup" href="pages/meetup.html">
          <span>World with You.<br>Let’s Hang!</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
